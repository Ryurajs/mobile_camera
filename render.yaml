services:
  - type: web
    name: camera-link-relay
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run relay
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PUBLIC_RELAY_HOST
        fromService:
          type: web
          name: camera-link-relay
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: camera-link-web
    runtime: static
    buildCommand: npm ci && npm run web:build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: EXPO_PUBLIC_SIGNALING_HOST
        fromService:
          type: web
          name: camera-link-relay
          envVarKey: PUBLIC_RELAY_HOST
